<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LocalDrop</title><meta name="theme-color" content="#0B8F8C">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#EEF4F6;color:#0c2a33;text-align:center;padding:24px}
@media(prefers-color-scheme:dark){body{background:#07141F;color:#e6f1f4}}
.r{width:64px;height:64px;border-radius:50%;border:5px solid #0B8F8C55;border-top-color:#0B8F8C;animation:s 1s linear infinite;margin:0 auto 20px}@keyframes s{to{transform:rotate(1turn)}}
button{margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#0B8F8C;color:#fff;font:inherit}</style></head>
<body><div><div class="r"></div><h2>Looking for LocalDrop</h2><p id="m">Searching this network for a LocalDrop device…</p><button id="b" hidden>Search again</button></div>
<script src="js/finder.js"></script></body></html>
