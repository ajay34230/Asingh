name: Build LocalDrop APK

on:
  push:
    branches: [localdrop-app]
    paths:
      - 'localdrop/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The server is plain Java, so it is tested first on the build machine itself.
      - name: Test the server
        working-directory: localdrop
        run: |
          set -e
          export LC_ALL=C.UTF-8
          mkdir -p "$RUNNER_TEMP/ld/root" "$RUNNER_TEMP/ld/data" "$RUNNER_TEMP/classes"
          echo "hello" > "$RUNNER_TEMP/ld/root/hello.txt"
          javac --release 8 -d "$RUNNER_TEMP/classes" app/src/main/java/com/ajay/localdrop/server/*.java desktop/*.java
          java -Dfile.encoding=UTF-8 -cp "$RUNNER_TEMP/classes" DesktopMain --port 8099 \
            --root "$RUNNER_TEMP/ld/root" --data "$RUNNER_TEMP/ld/data" --web app/src/main/assets/web --pin 123456 \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8099/api/ping >/dev/null && break; sleep 0.5; done
          GUEST_IP=$(hostname -I | awk '{print $1}')
          echo "guest ip: $GUEST_IP"
          if ! python3 tests/api_test.py --host 127.0.0.1 --guest-host "$GUEST_IP" --port 8099 --pin 123456 \
            --root "$RUNNER_TEMP/ld/root" > "$RUNNER_TEMP/test.log" 2>&1; then
            cat "$RUNNER_TEMP/test.log"; cat "$RUNNER_TEMP/server.log"
            grep -iE 'fail|error|traceback|exception' "$RUNNER_TEMP/test.log" | head -8 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/test.log" | tail -5

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the APK
        working-directory: localdrop
        run: gradle --no-daemon assembleRelease -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp localdrop/app/build/outputs/apk/release/app-release.apk dist/LocalDrop.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-apk
          path: dist/LocalDrop.apk
          retention-days: 30

      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete localdrop-latest --cleanup-tag --yes || true
          gh release create localdrop-latest dist/LocalDrop.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "LocalDrop (latest build)" \
            --notes "Latest build of the LocalDrop Android app from branch localdrop-app (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Open this page on your phone and download LocalDrop.apk. Android will ask you to allow installs from your browser the first time."

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LocalDrop-apk
          path: apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the APK in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash localdrop/tests/emulator_test.sh apk/LocalDrop.apk emu-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emu-out
      - name: Publish the emulator screenshots
        if: always()
        run: |
          [ -d emu-out ] || exit 0
          rm -f emu-out/blob.bin emu-out/self.apk
          cd emu-out
          git init -q -b emulator-results
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -qm "Emulator results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-results

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build LocalDrop for Windows
        run: |
          cd localdrop
          mkdir -p "$RUNNER_TEMP/wclasses" "$RUNNER_TEMP/win-in" "$RUNNER_TEMP/win-out"
          javac --release 8 -encoding UTF-8 -d "$RUNNER_TEMP/wclasses" app/src/main/java/com/ajay/localdrop/server/*.java desktop/*.java
          jar cfe "$RUNNER_TEMP/win-in/LocalDrop.jar" WindowsMain -C "$RUNNER_TEMP/wclasses" .
          cp -r app/src/main/assets/web "$RUNNER_TEMP/win-in/web"
          cp app/src/main/assets/tls.p12 "$RUNNER_TEMP/win-in/tls.p12"
          jpackage --type app-image --name LocalDrop --input "$RUNNER_TEMP/win-in" --main-jar LocalDrop.jar --main-class WindowsMain \
            --dest "$RUNNER_TEMP/win-out" --java-options "-Dfile.encoding=UTF-8"
          ls "$RUNNER_TEMP/win-out/LocalDrop"
          cd "$RUNNER_TEMP/win-out"
          powershell -NoProfile -Command "Compress-Archive -Path LocalDrop -DestinationPath LocalDrop-Windows.zip"
          ls -la LocalDrop-Windows.zip
          echo "ZIP=$RUNNER_TEMP/win-out/LocalDrop-Windows.zip" >> "$GITHUB_ENV"
      - name: Add it to the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload localdrop-latest "$ZIP" --clobber --repo "${{ github.repository }}" && break
            sleep 10
          done
