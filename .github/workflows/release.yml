name: Release AAB (manual, signed)

# Run from Actions -> "Run workflow". Without the four secrets below it still builds, but signs with a
# throwaway test key (artifact is named ...-TEST-SIGNED and CANNOT be uploaded to Play).
# It also runs on pushes that change this file, as a pipeline check.
# Secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_B64   base64 of your upload keystore (.jks)
#   RELEASE_KEYSTORE_PASS  keystore password
#   RELEASE_KEY_ALIAS      key alias
#   RELEASE_KEY_PASS       key password
# The keystore is decoded to a temp file on the runner and never committed or uploaded.
on:
  workflow_dispatch:
  push:
    branches:
      - "phase-*"
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.4.1"

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Detect signing secrets
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$K" ]; then echo "REAL_KEY=false" >> "$GITHUB_ENV"; echo "::warning::No release secrets: building with a throwaway TEST key"; else echo "REAL_KEY=true" >> "$GITHUB_ENV"; fi
      - name: Install Godot and templates
        run: |
          ci/install_godot.sh
          ci/install_templates.sh
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "platforms;android-36" "cmake;3.10.2.4988404"
      - name: Godot settings, Android build template, keystore
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.config/godot" build
          for f in editor_settings-4.4.tres editor_settings-4.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/$f"
          done
          if [ "$REAL_KEY" = "true" ]; then
            echo "$K" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias testkey -keyalg RSA -keysize 2048 -validity 30 \
              -storepass testpass123 -keypass testpass123 -dname "CN=Test"
          fi
          # Gradle build template ships inside the export templates
          mkdir -p android/build
          unzip -q -o "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          # Godot 4.4.1 templates compile against API 35; Play needs target 36, so raise compileSdk too.
          grep -rn "compileSdk\|targetSdk" android/build/config.gradle || true
          sed -i -E 's/(compileSdk[^0-9]*)35/\136/' android/build/config.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/build/gradle.properties
          grep -n "compileSdk" android/build/config.gradle
      - name: Export signed AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RELEASE_KEY_ALIAS || 'testkey' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASS || 'testpass123' }}
        run: |
          set -o pipefail
          GODOT=".ci/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "Android Release" build/TheLostKingdom.aab
          test -s build/TheLostKingdom.aab
          ls -l build
      - name: Verify manifest (target SDK, permissions, ABI)
        run: |
          curl -fsSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar bundletool.jar dump manifest --bundle build/TheLostKingdom.aab | tee build/manifest.xml
          grep -q 'targetSdkVersion="36"' build/manifest.xml || { echo "::error::targetSdkVersion is not 36"; exit 1; }
          echo "--- permissions:"; grep -o 'uses-permission[^/]*' build/manifest.xml || echo none
          unzip -l build/TheLostKingdom.aab | grep -o 'lib/[a-z0-9_-]*' | sort -u
          ls -l build/TheLostKingdom.aab
      - uses: actions/upload-artifact@v4
        with:
          name: TheLostKingdom-release-aab${{ env.REAL_KEY == 'true' && '' || '-TEST-SIGNED' }}
          path: build/TheLostKingdom.aab
          if-no-files-found: error
          retention-days: 7
