<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><!--@title--></title>
<!--@seo-->
<meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16100f" media="(prefers-color-scheme: dark)">
<!--@head-->
<link rel="stylesheet" href="css/styles.css">
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/pages.js" defer></script>
</head>
<body data-page="home">
<div id="page">
<main id="main">
<!--@hero-->
<!--@marquee-->
<!--@trust-->
<section class="section container" aria-labelledby="col-h" data-sec="collections">
  <div class="section__head"><h2 id="col-h" class="h2">Shop the Rajputi collection</h2><a class="link" href="shop.html">View all</a></div>
  <div class="rail rail--tiles" data-rail><ul class="rail__track" id="collections-track"></ul></div>
</section>
<!--@occasions-->
<section class="section container" aria-labelledby="new-h" data-sec="newArrivals">
  <div class="section__head"><h2 id="new-h" class="h2">New arrivals</h2><a class="link" href="shop.html?sort=new">Shop new in</a></div>
  <div class="grid" id="new-grid"></div>
</section>
<!--@story-->
<section class="section container" aria-labelledby="best-h" data-sec="bestsellers">
  <div class="section__head"><h2 id="best-h" class="h2">Bestsellers</h2>
    <div class="rail__nav"><button type="button" class="icon-btn icon-btn--bordered rail__btn rail__btn--prev" aria-label="Previous bestsellers"><svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button type="button" class="icon-btn icon-btn--bordered rail__btn rail__btn--next" aria-label="Next bestsellers"><svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div></div>
  <div class="rail" data-rail><div class="rail__track" id="best-track" tabindex="0" role="region" aria-label="Bestsellers — scroll horizontally"></div></div>
</section>
<section class="section container" aria-labelledby="love-h" data-sec="testimonials">
  <div class="section__head"><h2 id="love-h" class="h2">Loved across Rajasthan &amp; beyond</h2><span class="muted">Sample reviews</span></div>
  <div class="rail" data-rail><ul class="rail__track rail__track--quotes" id="quotes-track"></ul></div>
</section>
</main>
</div>
<noscript><p class="noscript">This store needs JavaScript to browse and check out. Please enable it and reload.</p></noscript>
</body>
</html>
