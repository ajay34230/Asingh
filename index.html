<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a120c" />
  <meta name="description" content="Royal India Ludo: a 3D Ludo board with palace courtyards, a lotus centrepiece and a dice you tap to roll." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:," />
  <title>Royal India Ludo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene" aria-label="Ludo board. Tap the dice to roll and tap a highlighted token to move it."></canvas>

  <header class="top">
    <div class="brand">
      <span class="brand-title">Royal Ludo</span>
      <span class="brand-sub">India</span>
    </div>

    <div class="turn" aria-live="polite">
      <span id="turn-chip" class="chip"></span>
      <span id="turn-text">Starting…</span>
    </div>

    <button id="menu-button" class="icon-button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <span aria-hidden="true">&#9776;</span>
    </button>
  </header>

  <div id="roll-status" class="roll-status">
    <div id="roll-text" aria-live="polite"></div>
    <div id="hint" class="hint"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <nav id="menu" class="menu" hidden aria-label="Game menu">
    <label>
      <span>Game</span>
      <select id="mode-select"></select>
    </label>
    <label>
      <span>Graphics</span>
      <select id="quality-select"></select>
    </label>
    <button id="new-game" class="button primary">New game</button>
  </nav>

  <section id="result" class="result" hidden aria-labelledby="result-title">
    <div class="result-card">
      <h2 id="result-title">Game over</h2>
      <ol id="result-list"></ol>
      <button id="play-again" class="button primary">Play again</button>
    </div>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
